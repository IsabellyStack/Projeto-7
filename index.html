<!DOCTYPE html>
<html>
    <head>
        <title>Cadastro de Usuário</title>
    </head>
    <body>
        <header>
            <h1>Cadastro de Usuário</h1>
            <nav>
                <ul>
                    <li><a href="html/principal.html">Página Principal</a></li>
                    <li><a href="html/sobre.html">Sobre Mim</a></li>
                    <li><a href="html/projetos.html">Meus Projetos</a></li>
                    <li><a href="html/contato.html">Contato</a></li>
                </ul>
            </nav>
        </header>

        <section>
            <h2>Formulário de Cadastro</h2>
            <form action="">
                <label for="#nome">Nome Completo:</label><br>
                <input type="text" id="nome"><br><br>

                <label for="#email">E-mail:</label><br>
                <input type="email" id="email"><br><br>

                <label for="#senha">Senha:</label><br>
                <input type="password" id="senha"><br><br>

                <label for="genero">Gênero:</label><br>
                <select name="genero" id="genero">
                    <option value="feminino">Feminino</option>
                    <option value="masculino">Masculino</option>
                    <option value="indefinido">Prefiro não dizer</option>
                </select><br><br>

                <label for="interesses">Interesses:</label><br>
                <input type="checkbox" id="programacao">
                <label for="programacao">Programação</label><br>
                <input type="checkbox" id="design">
                <label for="design">Design</label><br>
                <input type="checkbox" id="musica">
                <label for="musica">Música</label><br><br>

                <label for="biografia">Biografia:</label><br>
                <textarea name="biografia" id="biografia" rows="4" cols="40"></textarea><br><br>
                <input type="button" value="Enviar">
            </form>
        </section>

        <footer>
            <p><b>&copy; 2026 Meu Site Pessoal</b></p>
        </footer>
    </body>
</html>
